spring:
  datasource:
    url: jdbc:h2:mem:quizdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  development:
    seed:
      organizer-email: ${DEV_ORGANIZER_EMAIL:organizer@example.com}
      organizer-password: ${DEV_ORGANIZER_PASSWORD:password123}
