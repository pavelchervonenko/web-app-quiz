services:
  postgres:
    image: postgres:16
    container_name: quiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quiz}
      POSTGRES_USER: ${POSTGRES_USER:-quiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build:
      context: ./backend
    container_name: quiz-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/quiz}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-quiz}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
      RSA_PUBLIC_KEY: ${RSA_PUBLIC_KEY:?Set RSA_PUBLIC_KEY in .env}
      RSA_PRIVATE_KEY: ${RSA_PRIVATE_KEY:?Set RSA_PRIVATE_KEY in .env}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-https://your-domain.com}
      SERVER_PORT: ${SERVER_PORT:-8080}
    volumes:
      - ${JWT_PUBLIC_KEY_PATH:-./deploy/secrets/jwt-public.pem}:/run/secrets/jwt-public.pem:ro
      - ${JWT_PRIVATE_KEY_PATH:-./deploy/secrets/jwt-private.pem}:/run/secrets/jwt-private.pem:ro
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: quiz-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  postgres_data:
